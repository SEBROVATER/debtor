[package]
name = "debtor"
description = "Application binary — composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace]
resolver = "3"
members = [
    "debtor-application",
    "debtor-domain",
    "debtor-infra",
    "debtor-web",
]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
debtor-domain = { path = "debtor-domain" }
debtor-application = { path = "debtor-application" }
debtor-infra = { path = "debtor-infra" }
debtor-web = { path = "debtor-web" }
axum = "0.8"
tower-sessions = "0.14"
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.6", features = ["trace", "fs", "limit", "timeout"] }
tokio = { version = "1", features = ["full"] }
askama = "0.12"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-arbitrary-precision"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
time = "0.3"
ipnet = "2.12"
form_urlencoded = "1"

[dependencies]
debtor-application = { workspace = true }
debtor-infra = { workspace = true }
debtor-web = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-sessions = { workspace = true }
time = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }

[lints]
workspace = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
unwrap_used = "warn"
expect_used = "warn"
float_arithmetic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
