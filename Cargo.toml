[package]
name = "debtor"
description = "Application binary — composition root"
default-run = "debtor"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace]
resolver = "3"
members = [
    "debtor-application",
    "debtor-domain",
    "debtor-infra",
    "debtor-web",
]
default-members = ["."]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
debtor-domain = { path = "debtor-domain", version = "1.0.0" }
debtor-application = { path = "debtor-application", version = "1.0.0" }
debtor-infra = { path = "debtor-infra", version = "1.0.0" }
debtor-web = { path = "debtor-web", version = "1.0.0" }
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "query", "tokio", "tracing"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
tower = { version = "0.5", default-features = false, features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7", default-features = false, features = ["fs", "limit", "timeout"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "net", "signal", "sync", "time"] }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
time = "0.3"
ipnet = "2.12"
form_urlencoded = "1"
proptest = "1"

[dependencies]
debtor-application = { workspace = true }
debtor-infra = { workspace = true }
debtor-web = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-sessions = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
argon2 = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["form"] }

[lints]
workspace = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
unwrap_used = "warn"
expect_used = "warn"
float_arithmetic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
