[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    { crate = "getrandom@0.3.4", reason = "tower-sessions uses Rand 0.9 while UUID and build dependencies use getrandom 0.4" },
    { crate = "hashbrown@0.16.1", reason = "SQLx 0.9 requires both hashlink and indexmap with incompatible hashbrown versions" },
    { crate = "r-efi@5.3.0", reason = "transitive from Rand 0.9's getrandom 0.3; current build dependencies use getrandom 0.4" },
    { crate = "rand_core@0.6.4", reason = "Argon2's password-hash 0.5 requires Rand Core 0.6 while tower-sessions requires Rand 0.9" },
    { crate = "syn@2.0.119", reason = "current proc-macro dependencies span incompatible Syn 2 and Syn 3 requirements" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
