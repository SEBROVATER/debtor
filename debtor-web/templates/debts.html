<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Debts | debtor</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous" defer></script>
    <script src="/static/response-targets.js" integrity="sha384-NtTh9TBZ2X/pFpfsVvQOjSsYWmjmqG6h5ioQWVAe2/j3AuTHRmfqvoqp+iOed+I0" crossorigin="anonymous" defer></script>
  </head>
  <body>
    <header id="authenticated-header" class="site-header" aria-busy="false">
      <a href="/groups">debtor</a>
      <nav aria-label="Group navigation">
        <a href="/groups">Groups</a><a href="/groups/{{ group_id }}">Summary</a><a href="/groups/{{ group_id }}/transactions">Transactions</a><a href="/groups/{{ group_id }}/debts" aria-current="page">Debts</a><a href="/groups/{{ group_id }}/manage">Manage</a>
      </nav>
      <form method="post" action="/logout" class="sign-out-form" hx-ext="response-targets" hx-target="#sign-out-status" hx-target-4xx="#sign-out-status" hx-target-5xx="#sign-out-status">
        <input type="hidden" name="csrf" value="{{ shell.csrf }}" />
        <input type="hidden" name="submission_token" value="{{ shell.submission_token }}" />
        <button type="submit" class="sign-out-button" hx-post="/logout" hx-disabled-elt="button" hx-indicator="#sign-out-status">Sign out</button>
        <p id="sign-out-status" class="status" role="status" aria-live="polite" aria-atomic="true"> </p>
      </form>
    </header>
    <main>
      <div class="page-heading">
        <div>
          <h1 id="debts-heading" class="group-heading" tabindex="-1">All-time Debts{% if archived %} <span>Archived</span>{% endif %}</h1>
          <p>Target currency: <strong>{{ currency }}</strong>.</p>
        </div>
        {% if !archived %}<p><a class="button" href="/groups/{{ group_id }}/spendings/new">Add Spending</a></p>{% endif %}
      </div>
      <form method="get" action="/groups/{{ group_id }}/debts" class="debt-mode-form" hx-ext="response-targets" hx-get="/groups/{{ group_id }}/debts" hx-trigger="change" hx-push-url="true" hx-target="#debts-results" hx-target-4xx="#debts-results" hx-target-5xx="#debts-results" hx-swap="outerHTML" hx-indicator="#debts-results">
        <fieldset>
          <legend>Rate mode</legend>
          <div class="choice-row">
            <label><input id="rate-mode-historical" type="radio" name="rate_mode" value="historical" aria-controls="debts-results"{% if mode == "historical" %} checked{% endif %} /> Historical</label>
            <label><input id="rate-mode-current" type="radio" name="rate_mode" value="current" aria-controls="debts-results"{% if mode == "current" %} checked{% endif %} /> Current</label>
          </div>
          <button type="submit">Calculate balances</button>
        </fieldset>
      </form>
      {% include "debts_results.html" %}
    </main>
  </body>
</html>
