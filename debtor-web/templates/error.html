<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Error | debtor</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
    <body class="error-page">
       <main>
        <section aria-busy="false" aria-labelledby="error-heading">
          <h1 id="error-heading" tabindex="-1" autofocus>Request status</h1>
          <p id="error-status" class="error" role="alert" aria-live="assertive" aria-atomic="true">{{ message }}</p>
         {% if login_recovery %}
         <a href="/login">Return to Sign in</a>
          {% else %}
          <a href="{{ recovery_path }}">Reload the form</a>
         {% endif %}
       </section>
      </main>
  </body>
</html>
