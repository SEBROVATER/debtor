<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | Debtor</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous" defer></script>
  </head>
    <body class="login-page">
    <main class="access-page">
      <section class="access-form" id="login-form-region" aria-labelledby="sign-in-heading" aria-busy="false">
        <p class="eyebrow">PRIVATE LEDGER</p>
        <h1 id="sign-in-heading" tabindex="-1"{% if focus_heading %} autofocus{% endif %}>Sign in</h1>
        <p id="sign-in-description" class="muted">Use the administrator password to open Debtor.</p>
        <div id="login-status" class="status" role="status" aria-live="polite" aria-atomic="true" aria-describedby="sign-in-description">
          {% match error %}{% when Some with (message) %}{{ message }}{% when None %}{% endmatch %}
        </div>
        <form method="post" action="/login" hx-post="/login" hx-target="#login-form-region" hx-swap="outerHTML" hx-disabled-elt="button" aria-describedby="sign-in-description login-status">
          <input type="hidden" name="csrf" value="{{ csrf }}" />
          <input type="hidden" name="submission_token" value="{{ submission_token }}" />
          <label for="password">Password</label>
          <input id="password" type="password" name="password" required autocomplete="current-password" aria-describedby="sign-in-description login-status" />
          <button class="access-submit" type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
