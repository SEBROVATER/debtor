<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit participant | debtor</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous" defer></script>
    <script src="/static/response-targets.js" integrity="sha384-NtTh9TBZ2X/pFpfsVvQOjSsYWmjmqG6h5ioQWVAe2/j3AuTHRmfqvoqp+iOed+I0" crossorigin="anonymous" defer></script>
  </head>
  <body>
    <header id="authenticated-header" class="site-header" aria-busy="false">
      <a href="/participants">Participants</a>
      <form method="post" action="/logout" class="sign-out-form" hx-ext="response-targets" hx-target="#sign-out-status" hx-target-4xx="#sign-out-status" hx-target-5xx="#sign-out-status">
        <input type="hidden" name="csrf" value="{{ shell.csrf }}" />
        <input type="hidden" name="submission_token" value="{{ shell.submission_token }}" />
        <button type="submit" class="sign-out-button" hx-post="/logout" hx-disabled-elt="button" hx-indicator="#sign-out-status">Sign out</button>
        <p id="sign-out-status" class="status" role="status" aria-live="polite" aria-atomic="true"> </p>
      </form>
    </header>
    <main>
      <h1>Edit participant</h1>
      {% match error %}{% when Some with (message) %}
       <p id="participant-edit-error" class="error" role="alert">{{ message }}</p>
      {% when None %}{% endmatch %}
      <form method="post" action="/participants/{{ id }}" class="mutation-form" aria-describedby="participant-edit-error" hx-post="/participants/{{ id }}" hx-disabled-elt="button" hx-indicator="#participant-edit-status" aria-busy="false">
        <input type="hidden" name="csrf" value="{{ csrf }}" /><input type="hidden" name="submission_token" value="{{ shell.submission_token }}" /><label
          >Name <input name="name" value="{{ name }}" required /></label
        ><label>Color <input type="color" name="color" value="{{ color }}" required /></label
        ><button type="submit">Save participant</button><p id="participant-edit-status" class="mutation-status" role="status" aria-live="polite" aria-atomic="true"> </p>
      </form>
    </main>
  </body>
</html>
