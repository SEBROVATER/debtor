version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/tools/password-hash"
    schedule:
      interval: weekly
    groups:
      password-helper-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
