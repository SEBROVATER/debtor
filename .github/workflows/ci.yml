name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check architecture
        run: cargo run --bin architecture-check --locked
      - name: Check dependency policy
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
      - name: Check workspace
        run: cargo check --workspace --all-features --locked
      - name: Run Clippy offline
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Check SQLx metadata
        env:
          DATABASE_URL: sqlite:///tmp/debtor-ci.db?mode=rwc
          SQLX_OFFLINE: "false"
        run: |
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite,rustls
          cargo sqlx migrate run --source migrations
          cargo sqlx prepare --workspace --check

  password-helper:
    name: Password helper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: cargo fmt --manifest-path tools/password-hash/Cargo.toml -- --check
      - name: Check dependency policy
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path tools/password-hash/Cargo.toml --config tools/password-hash/deny.toml check
      - name: Check package metadata
        run: cargo metadata --manifest-path tools/password-hash/Cargo.toml --locked --no-deps --format-version 1 | jq -e '.packages | length == 1 and .[0].publish == []'
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/password-hash/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path tools/password-hash/Cargo.toml --locked
