name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  production:
    name: Production workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check architecture
        run: cargo run --bin architecture-check --locked
      - name: Check workspace
        run: cargo check --workspace --all-features --locked
      - name: Run Clippy offline
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

  password-helper:
    name: Password helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --manifest-path tools/password-hash/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/password-hash/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path tools/password-hash/Cargo.toml --locked
